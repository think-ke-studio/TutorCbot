version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8070:8070"
    environment:
      - GROQ_API_KEY= fill from env file
    volumes:
      - ./chromadb_grammar_kb:/app/chromadb_grammar_kb

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8070
    depends_on:
      - backend
