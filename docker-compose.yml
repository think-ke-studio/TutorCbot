version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./chromadb_grammar_kb:/app/chromadb_grammar_kb

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-8501}:${FRONTEND_PORT:-8501}"
    environment:
      - BACKEND_URL=http://backend:${BACKEND_PORT:-8000}
    depends_on:
      - backend
